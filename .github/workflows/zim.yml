# O ZIM diário da WalkScape Wiki, inteiro no GitHub Actions (sem servidor): todo dia às 04:23 UTC (ou à mão, em
# Actions > "ZIM da wiki" > Run workflow), o mwoffliner baixa a wiki, mobile/patch_zim.py aplica o layout para celular e
# a release v<AAAA-MM-DD> recebe o arquivo (criada, ou com o arquivo trocado se já existir).
#
# O mwoffliner exige um e-mail de contato (vai no User-Agent dos pedidos à wiki): a variável ADMIN_EMAIL do repositório
# (Settings > Secrets and variables > Actions > Variables).
name: ZIM da wiki

on:
  schedule:
    # fora da hora cheia: em 27/11/2026 o "0 3 * * *" não rodou (o GitHub atrasa ou descarta agendamentos na hora
    # cheia); e depois das ~03:35 UTC, quando o job antigo de fora do GitHub publica a release do dia, que esta troca
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      articles:
        description: "Só para testar: páginas separadas por vírgula (gera um ZIM pequeno como artefato e não publica)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: zim
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      ARTICLES: ${{ inputs.articles }}
      MWOFFLINER: ghcr.io/openzim/mwoffliner:1.17.5
    steps:
      - uses: actions/checkout@v4

      - name: Data e e-mail de contato
        run: |
          test -n "$ADMIN_EMAIL" || { echo "::error::defina a variável ADMIN_EMAIL do repositório"; exit 1; }
          echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Baixar a wiki (mwoffliner)
        run: |
          mkdir -p raw
          extra=()
          if [ -n "$ARTICLES" ]; then extra+=(--articleList="$ARTICLES"); fi
          # a imagem sobe o próprio Redis e passa o --redis; a wiki fica na raiz (/api.php, /load.php), não em /w/.
          # scripts/mwoffliner-mylanguage.mjs: os links Special:MyLanguage/<página> da wiki viram links para a página
          # (sem o patch, o mwoffliner os remove e a navegação entre as páginas some)
          docker run --rm -v "$PWD/raw:/out" -v "$PWD/scripts:/patch:ro" "$MWOFFLINER" sh -c \
            'node /patch/mwoffliner-mylanguage.mjs /tmp/mwoffliner/lib/util/rewriteUrls.js && exec mwoffliner "$@"' sh \
            --mwUrl=https://wiki.walkscape.app/ \
            --mwActionApiPath=/api.php \
            --adminEmail="$ADMIN_EMAIL" \
            --filenamePrefix=walkscape_offline \
            --customZimTags=walkscape \
            --publisher=openZIM \
            --webp \
            --outputDirectory=/out \
            "${extra[@]}"
          ls -la raw

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Layout para celular
        run: |
          pip install "libzim>=3.4,<4"
          mkdir -p out
          for f in raw/*.zim; do python mobile/patch_zim.py "$f" "out/$(basename "$f")"; done
          ls -la out

      - name: Guardar o ZIM de teste
        if: ${{ inputs.articles != '' && inputs.articles != null }}
        uses: actions/upload-artifact@v4
        with:
          name: zim-teste
          path: out/*.zim
          retention-days: 3

      - name: Publicar a release
        if: ${{ inputs.articles == '' || inputs.articles == null }}
        run: |
          tag="v$DAY"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.zim -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" out/*.zim -R "$GITHUB_REPOSITORY" \
              --title "WalkScape Wiki Dump - $DAY" --notes "Backup automático."
          fi
