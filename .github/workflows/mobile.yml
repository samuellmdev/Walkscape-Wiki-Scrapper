# O layout para celular no ZIM de cada release (mobile/patch_zim.py): quando a release diária é publicada, baixa o
# .zim, aplica o CSS e as tabelas que rolam para o lado e troca o arquivo na mesma release. Para refazer uma release
# antiga: Actions > "Layout para celular" > Run workflow, com a tag.
name: Layout para celular

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v2026-11-26)"
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o libzim
        run: pip install "libzim>=3.4,<4"
      - name: Baixar o ZIM da release
        run: |
          mkdir -p in out
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zim' -D in
          ls -la in
      - name: Aplicar o layout para celular
        run: |
          for f in in/*.zim; do python mobile/patch_zim.py "$f" "out/$(basename "$f")"; done
          ls -la out
      - name: Trocar o arquivo na release
        run: gh release upload "$TAG" out/*.zim -R "$GITHUB_REPOSITORY" --clobber
