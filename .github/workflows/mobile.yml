# O layout para celular no ZIM de cada release (mobile/patch_zim.py): quando a release diária é publicada, baixa o
# .zim, aplica o CSS e as tabelas que rolam para o lado e troca o arquivo na mesma release. Para refazer uma release
# antiga: Actions > "Layout para celular" > Run workflow, com a tag.
name: Layout para celular

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v2026-11-26)"
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o libzim
        run: pip install "libzim>=3.4,<4"
      - name: Baixar o ZIM da release
        run: |
          mkdir -p in out
          # o evento "published" chega antes de o arquivo terminar de subir (gh release create publica a release e só
          # depois manda o .zim; em 27/11/2026 o download saiu vazio 8 s depois): espera até 20 min por ele
          ready() {
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[] | select(.name | endswith(".zim")) | .state] | length > 0 and all(. == "uploaded")'
          }
          for i in $(seq 40); do
            [ "$(ready)" = true ] && break
            echo "o .zim da release $TAG ainda está subindo ($i/40): de novo em 30 s"
            sleep 30
          done
          [ "$(ready)" = true ] || { echo "::error::nenhum .zim pronto na release $TAG depois de 20 min"; exit 1; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zim' -D in
          ls -la in
      - name: Aplicar o layout para celular
        run: |
          for f in in/*.zim; do
            # o ZIM da wiki (zim.yml) já sai com o layout: a release que ele cria dispara este fluxo, e não há o que refazer
            if python -c 'import sys; from libzim.reader import Archive; sys.exit(0 if Archive(sys.argv[1]).has_entry_by_path("_res_/mobile.css") else 1)' "$f"; then
              echo "$f já tem o layout para celular: fica como está"
              continue
            fi
            python mobile/patch_zim.py "$f" "out/$(basename "$f")"
          done
          ls -la out
      - name: Trocar o arquivo na release
        run: |
          if ls out/*.zim >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.zim -R "$GITHUB_REPOSITORY" --clobber
          else
            echo "nada a trocar na release $TAG"
          fi
